<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineworld - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <nav>
        <a href="index.html" style="text-decoration: none;"><h1 class="logo">CINEWORLD</h1></a>
    </nav>
    
    <div class="login-container">
        <h2>Sign In</h2>
        
        <!-- Email/Password Login -->
        <form id="login-form">
            <input type="email" id="email-input" placeholder="Email or phone number" required>
            <input type="password" id="password-input" placeholder="Password" required>
            <button type="submit" class="login-submit-btn">Sign In</button>
        </form>

        <div class="divider">OR</div>

        <!-- Google Login -->
        <button type="button" id="google-login-btn" class="google-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
            Sign in with Google
        </button>

        <div class="login-help">
            <p>New to Cineworld? <b>Sign up now.</b></p>
        </div>
    </div>

    <!-- Script එක module එකක් විදිහට සම්බන්ධ කිරීම -->
    <script type="module" src="login.js"></script>
</body>
</html>
